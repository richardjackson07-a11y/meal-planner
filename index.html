<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f1420">
<title>Jackson Family Meal Planner</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#0f1420;
    --card:#182130;
    --card2:#1e2838;
    --line:#2b3648;
    --text:#eef2f8;
    --muted:#9aa7bd;
    --accent:#f97316;
    --accent2:#22c55e;
    --purple:#8b5cf6;
    --warn:#f59e0b;
    --danger:#ef4444;
    --radius:16px;
    --shadow:0 6px 20px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:linear-gradient(180deg,#0d1220,#0f1420 40%);
    color:var(--text);line-height:1.4;
    padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 40px);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:560px;margin:0 auto;padding:16px}
  header{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  header .logo{
    width:42px;height:42px;border-radius:12px;flex:0 0 auto;
    background:linear-gradient(135deg,var(--accent),#ef4444);
    display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:var(--shadow)
  }
  header h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.2px}
  header p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:14px;box-shadow:var(--shadow)}
  .field{margin-bottom:12px}
  .field:last-child{margin-bottom:0}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
  input,select,textarea{
    width:100%;background:var(--card2);border:1px solid var(--line);color:var(--text);
    border-radius:12px;padding:12px;font-size:16px;font-family:inherit;appearance:none
  }
  textarea{resize:vertical;min-height:44px;line-height:1.45}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(249,115,22,.22)}
  .row{display:flex;gap:10px}
  .row>*{flex:1}

  /* Tab bar */
  .tabs{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:14px;position:sticky;top:8px;z-index:20;box-shadow:var(--shadow)}
  .tabs button{flex:1;background:transparent;border:none;color:var(--muted);padding:10px 4px;font-size:12.5px;font-weight:700;border-radius:10px;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:3px}
  .tabs button .ti{font-size:17px;line-height:1}
  .tabs button.active{background:var(--accent);color:#fff}
  section.tab{display:none}
  section.tab.active{display:block}

  /* Week nav */
  .weeknav{display:flex;gap:8px;align-items:stretch}
  .weeknav .wlabel{flex:1;background:var(--card2);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;cursor:pointer}
  .weeknav .wlabel b{font-size:15px}
  .weeknav .wlabel span{font-size:11.5px;color:var(--muted)}
  .navbtn{width:46px;flex:0 0 auto;background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:12px;font-size:22px;cursor:pointer;font-family:inherit}
  .navbtn:active{background:var(--accent);border-color:var(--accent)}

  /* Day rows */
  .day{border:1px solid var(--line);border-radius:14px;margin-bottom:8px;background:var(--card2);overflow:hidden}
  .day:last-child{margin-bottom:0}
  .day-head{display:flex;align-items:center;gap:10px;padding:11px 10px;cursor:pointer}
  .day-head .dow{width:42px;flex:0 0 auto;text-align:center}
  .day-head .dow b{display:block;font-size:12.5px;font-weight:800;letter-spacing:.5px}
  .day-head .dow span{display:block;font-size:11px;color:var(--muted)}
  .day-head .meal{flex:1;min-width:0}
  .day-head .meal .mname{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .day-head .meal .mname.none{color:var(--muted);font-weight:500;font-style:italic}
  .day-head .meal .msub{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .day-head .emoji{font-size:21px;width:25px;text-align:center;flex:0 0 auto}
  .day-head .x{background:transparent;border:none;color:var(--muted);font-size:17px;cursor:pointer;padding:4px 2px;flex:0 0 auto}
  .day-head .x:active{color:var(--danger)}
  .day.today{box-shadow:inset 3px 0 0 var(--accent)}
  .serv{display:flex;align-items:center;gap:5px;flex:0 0 auto}
  .serv button{width:27px;height:27px;background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:8px;font-size:15px;cursor:pointer;line-height:1;font-family:inherit;padding:0}
  .serv b{font-size:12px;color:var(--muted);min-width:14px;text-align:center;font-weight:700}

  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
    border:none;border-radius:14px;padding:14px;font-size:15.5px;font-weight:700;font-family:inherit;cursor:pointer;color:#fff}
  .btn.primary{background:linear-gradient(135deg,var(--accent),#ef4444)}
  .btn.green{background:linear-gradient(135deg,var(--accent2),#16a34a)}
  .btn.purple{background:linear-gradient(135deg,var(--purple),#6366f1)}
  .btn.ghost{background:var(--card2);border:1px solid var(--line);color:var(--text)}
  .btn+.btn{margin-top:10px}
  .btn:active{transform:translateY(1px)}
  .btn.sm{padding:11px;font-size:13.5px;border-radius:12px}
  .btn.danger{background:linear-gradient(135deg,var(--danger),#b91c1c)}

  .quick{display:flex;gap:8px;flex-wrap:wrap}
  .chip{background:var(--card2);border:1px solid var(--line);color:var(--text);padding:8px 12px;border-radius:999px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .minibtn{background:var(--card2);border:1px solid var(--line);color:var(--text);padding:7px 11px;border-radius:999px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap}
  .minibtn:active{background:var(--accent);border-color:var(--accent)}
  .minibtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
  h2.sec{font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:0 4px 8px}
  .sechead{display:flex;justify-content:space-between;align-items:center;margin:0 4px 8px;gap:8px}
  .sechead h2.sec{margin:0}
  .sechead .cnt{font-size:11.5px;color:var(--muted);font-weight:600}
  .empty{color:var(--muted);font-size:13.5px;text-align:center;padding:16px 8px;line-height:1.55}
  .hint{font-size:12px;color:var(--muted);margin:0 0 10px;text-align:center;line-height:1.5}
  .subtle{font-size:11.5px;color:var(--muted);margin-top:6px}

  /* Recipe list */
  .rcard{border:1px solid var(--line);border-radius:14px;background:var(--card2);margin-bottom:10px;overflow:hidden;box-shadow:var(--shadow)}
  .rhead{display:flex;align-items:center;gap:11px;padding:12px;cursor:pointer}
  .rhead .emoji{font-size:22px;flex:0 0 auto;width:26px;text-align:center}
  .rhead .rmain{flex:1;min-width:0}
  .rhead .rmain b{font-size:15px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rhead .rmain span{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
  .rhead .chev{color:var(--muted);font-size:13px;transition:transform .2s;flex:0 0 auto}
  .rcard.open .chev{transform:rotate(90deg)}
  .rbody{display:none;padding:0 12px 12px}
  .rcard.open .rbody{display:block}
  .rbody ul{margin:0 0 10px;padding-left:18px;font-size:13.5px}
  .rbody ul li{margin:4px 0}
  .rbody .notes{font-size:13px;color:var(--muted);white-space:pre-wrap;border-left:2px solid var(--line);padding-left:10px;margin:0 0 10px}
  .tagrow{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
  .tag{background:rgba(139,92,246,.16);border:1px solid rgba(139,92,246,.4);color:#c4b5fd;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:.3px}

  /* Shopping list */
  .meter-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
  .meter-top .big{font-size:26px;font-weight:800}
  .meter-top .big small{font-size:14px;color:var(--muted);font-weight:600}
  .meter-top .cap{font-size:12.5px;color:var(--muted);text-align:right}
  .bar{height:12px;border-radius:999px;background:var(--card2);overflow:hidden;border:1px solid var(--line)}
  .bar>span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent2),#16a34a);transition:width .25s ease}
  .syncbtn{margin-left:auto;flex:0 0 auto;display:flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:6px 11px;font-size:11.5px;font-weight:700;font-family:inherit;cursor:pointer}
  .syncbtn .dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:0 0 auto}
  .syncbtn.ok{color:var(--accent2)} .syncbtn.ok .dot{background:var(--accent2)}
  .syncbtn.err{color:var(--danger)} .syncbtn.err .dot{background:var(--danger)}
  .syncbtn.busy{color:var(--warn)} .syncbtn.busy .dot{background:var(--warn)}
  /* sign-in / household gate */
  .gate{position:fixed;inset:0;z-index:80;background:linear-gradient(180deg,#0d1220,#0f1420 40%);display:none;overflow-y:auto}
  .gate.show{display:flex;align-items:center;justify-content:center;padding:24px}
  .gatecard{max-width:400px;width:100%;text-align:center}
  .gatecard .glogo{width:64px;height:64px;border-radius:18px;margin:0 auto 18px;
    background:linear-gradient(135deg,var(--accent),#ef4444);display:flex;align-items:center;justify-content:center;font-size:32px;box-shadow:var(--shadow)}
  .gatecard h2{font-size:21px;margin:0 0 8px;font-weight:700}
  .gatecard p{font-size:14px;color:var(--muted);margin:0 0 20px;line-height:1.6}
  .gatecard .field{text-align:left}
  .gatecard .note{font-size:12.5px;color:var(--muted);margin-top:14px;line-height:1.6}
  .gatecard .big{font-size:38px;margin-bottom:12px}
  .storeline{font-size:11.5px;color:var(--muted);margin-top:9px;padding-top:9px;border-top:1px solid var(--line);text-align:center;line-height:1.5}
  .storeline b{color:var(--text)}
  .aisle{margin-bottom:16px}
  .aisle:last-child{margin-bottom:0}
  .aisle h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--accent);margin:0 0 4px 2px;font-weight:800}
  .item{display:flex;align-items:flex-start;gap:10px;padding:9px 4px;border-bottom:1px dashed var(--line);cursor:pointer}
  .item:last-child{border-bottom:none}
  .box{width:21px;height:21px;flex:0 0 auto;border-radius:6px;border:2px solid var(--line);margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:12px;color:transparent;font-weight:900}
  .item.done .box{background:var(--accent2);border-color:var(--accent2);color:#0f1420}
  .item .txt{flex:1;font-size:14.5px;min-width:0}
  .item .txt em{font-style:normal;color:var(--muted);font-size:11.5px;display:block;margin-top:1px}
  .item.done .txt{text-decoration:line-through;color:var(--muted)}
  .item .del{background:transparent;border:none;color:var(--muted);font-size:15px;cursor:pointer;padding:0 4px}
  .item.hide{display:none}

  /* Sheet / modal */
  .sheet{position:fixed;inset:0;z-index:60;display:none}
  .sheet.show{display:block}
  .sheet .scrim{position:absolute;inset:0;background:rgba(4,8,16,.65)}
  .sheet .panel{
    position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow-y:auto;
    background:var(--card);border-top:1px solid var(--line);border-radius:20px 20px 0 0;
    padding:8px 16px calc(env(safe-area-inset-bottom) + 20px);max-width:560px;margin:0 auto;
    box-shadow:0 -8px 30px rgba(0,0,0,.5);animation:up .22s ease
  }
  @keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:translateY(0);opacity:1}}
  .grab{width:40px;height:4px;border-radius:999px;background:var(--line);margin:6px auto 12px}
  .sheet h3.sh{margin:0 0 12px;font-size:17px;font-weight:700}
  .picklist{max-height:44vh;overflow-y:auto;margin:0 -4px 12px}
  .pick{display:flex;align-items:center;gap:10px;padding:11px 8px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:10px}
  .pick:last-child{border-bottom:none}
  .pick:active{background:var(--card2)}
  .pick .emoji{font-size:20px;width:24px;text-align:center;flex:0 0 auto}
  .pick b{font-size:14.5px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pick span{font-size:11.5px;color:var(--muted);flex:0 0 auto}

  .toast{
    position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 20px);transform:translateX(-50%) translateY(20px);
    background:#0b1220;border:1px solid var(--line);color:var(--text);padding:12px 18px;border-radius:12px;
    box-shadow:var(--shadow);font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:90;max-width:90%;text-align:center
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media print{
    .tabs,.btn,.navbtn,.minibtn,.chip,.item .del,header p,.hint,#tab-week,#tab-recipes,.meter-top,.bar{display:none!important}
    body{background:#fff;color:#000}.card{box-shadow:none;border:none;padding:0}
    .aisle h3{color:#000}.item .txt{color:#000}.box{border-color:#666}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="logo">🍽️</div>
    <div>
      <h1>Jackson Family Meal Planner</h1>
      <p>Weekly dinners · recipe box · shopping list by H-E-B aisle</p>
    </div>
    <button class="syncbtn" data-act="account" id="syncbtn"><span class="dot"></span><span id="synctext">…</span></button>
  </header>

  <nav class="tabs">
    <button data-tab="week" class="active"><span class="ti">📅</span>Week</button>
    <button data-tab="recipes"><span class="ti">📖</span>Recipes</button>
    <button data-tab="shop"><span class="ti">🛒</span>Shopping</button>
  </nav>

  <!-- ============ WEEK ============ -->
  <section class="tab active" id="tab-week">
    <div class="card">
      <div class="weeknav">
        <button class="navbtn" data-act="prevweek">‹</button>
        <div class="wlabel" data-act="thisweek" id="wlabel"><b>—</b><span>—</span></div>
        <button class="navbtn" data-act="nextweek">›</button>
      </div>
      <div class="quick" style="margin-top:10px">
        <button class="minibtn" data-act="copylast">Copy last week</button>
        <button class="minibtn" data-act="fillrandom">🎲 Fill empty days</button>
        <button class="minibtn" data-act="clearweek">Clear</button>
      </div>
    </div>

    <div class="sechead"><h2 class="sec">Dinners</h2><span class="cnt" id="weekcount"></span></div>
    <div class="card" style="padding:10px"><div id="days"></div></div>

    <div class="card">
      <button class="btn purple" data-act="shareweek">📤 Share this week's menu</button>
      <button class="btn ghost" data-act="gotoshop">🛒 Build the shopping list</button>
    </div>
  </section>

  <!-- ============ RECIPES ============ -->
  <section class="tab" id="tab-recipes">
    <div class="card">
      <div class="field"><input type="search" id="rsearch" placeholder="Search recipes or ingredients…"></div>
      <div class="quick" id="tagfilter"></div>
    </div>
    <div class="card">
      <button class="btn primary" data-act="newrecipe">＋ New recipe</button>
      <button class="btn ghost sm" data-act="bulkimport" style="margin-top:10px">📋 Paste in several recipes at once</button>
      <div class="row" style="margin-top:10px">
        <button class="btn ghost sm" data-act="export">⬇︎ Backup</button>
        <button class="btn ghost sm" data-act="import">⬆︎ Restore</button>
      </div>
      <input type="file" id="filein" accept="application/json,.json" style="display:none">
    </div>
    <div class="sechead"><h2 class="sec">Recipe box</h2><span class="cnt" id="rcount"></span></div>
    <div id="recipes"></div>
  </section>

  <!-- ============ SHOPPING ============ -->
  <section class="tab" id="tab-shop">
    <div class="card">
      <div class="meter-top">
        <div class="big" id="shopdone">0<small> / 0</small></div>
        <div class="cap" id="shopweek">—</div>
      </div>
      <div class="bar"><span id="shopbar"></span></div>
      <div class="storeline" id="storeline"></div>
      <div class="quick" style="margin-top:10px">
        <button class="minibtn" data-act="uncheckall">Uncheck all</button>
        <button class="minibtn" data-act="togglehide" id="hidebtn">Hide checked</button>
        <button class="minibtn" data-act="print">🖨 Print</button>
      </div>
    </div>

    <div class="card">
      <div class="row">
        <input type="text" id="extrain" placeholder="Add an extra item…" style="flex:3">
        <button class="btn green sm" data-act="addextra" style="flex:0 0 84px">Add</button>
      </div>
    </div>

    <div class="card" id="shoplist"></div>

    <div class="card">
      <button class="btn purple" data-act="sharelist">📤 Share shopping list</button>
      <button class="btn ghost" data-act="copylist">📋 Copy as text</button>
    </div>
  </section>

  <p class="hint">Everything saves on this device automatically.<br>Use <b>Backup</b> on the Recipes tab to keep a copy of your recipe box.</p>
</div>

<div class="gate" id="gate"></div>
<div class="sheet" id="sheet"><div class="scrim" data-act="closesheet"></div><div class="panel"><div class="grab"></div><div id="sheetbody"></div></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   Jackson Family Meal Planner
   Single-file app. All data in localStorage.
   ============================================================ */
const KEY = "mealPlanner.v1";
const DAYS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
/* H-E-B League City Market #697, 2755 E. League City Pkwy — sections and aisle
   contents taken from that store's own printed guide. Listed in the order you
   walk it: perimeter departments first, then the aisles in numerical order. */
const STORE_NAME = "H-E-B League City Market";
const STORE_ADDR = "2755 E. League City Pkwy";
const AISLES = [
  "Produce","Bakery","Deli","Market · Meat","Seafood","Dairy",
  "Aisle 1 · Beer & Wine",
  "Aisle 2 · Bread, Tortillas, Peanut Butter",
  "Aisle 3 · Condiments, Pickles, Asian",
  "Aisle 4 · Pasta, Rice, Beans, Cajun, Soup",
  "Aisle 5 · Canned Goods",
  "Aisle 6 · Baking, Spices, Oil, Sugar",
  "Aisle 7 · Cereal, Syrup, Dried Fruit",
  "Aisle 8 · Chips & Snacks",
  "Aisle 9 · Coffee, Tea, Cookies, Crackers",
  "Aisle 10 · Juice, Candy, Drink Mixes",
  "Aisle 11 · Sodas & Sports Drinks",
  "Aisle 12 · Water",
  "Aisle 17 · Charcoal, Matches, Appliances",
  "Aisle 18 · Bakeware & Kitchen Gadgets",
  "Aisle 19 · School, Office, Toys",
  "Aisle 21 · Party & Gift Wrap",
  "Aisle 24 · Paper Towels, Bath Tissue, Hardware",
  "Aisle 25 · Foil, Wrap, Bags, Napkins",
  "Aisle 26 · Cleaners, Dish Soap, Candles",
  "Aisle 27 · Laundry, Auto, Light Bulbs",
  "Aisle 28 · Cat",
  "Aisle 29 · Dog & Bird",
  "Aisle 30 · Baby",
  "Aisle 31 · Hair Care",
  "Aisle 32 · Skin & Bath",
  "Aisle 33 · Deodorant, Shaving, Shoe Care",
  "Aisle 34 · Dental & Eye Care",
  "Aisle 35 · First Aid & Feminine",
  "Aisle 36 · Vitamins & Diet",
  "Aisle 37 · Cough & Cold",
  "Floral & Blooms",
  "Left Wall · Diapers & Wipes",
  "Checkstands · Ice, Batteries",
  "Not sure — ask"
];
const A = {};
AISLES.forEach(a=>{
  const m=a.match(/^Aisle (\d+)/);
  A[m? "a"+m[1] : a.split(" ")[0].toLowerCase()] = a;
});

/* ---------- date helpers ---------- */
function pad(n){return String(n).padStart(2,"0")}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function parseISO(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function mondayOf(d){const x=new Date(d);const w=(x.getDay()+6)%7;x.setDate(x.getDate()-w);x.setHours(0,0,0,0);return x}
function addDaysISO(s,n){const d=parseISO(s);d.setDate(d.getDate()+n);return iso(d)}
function dateForDay(wk,i){const d=parseISO(wk);d.setDate(d.getDate()+i);return d}
function weekRange(wk){
  const a=parseISO(wk), b=parseISO(addDaysISO(wk,6));
  const M=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const s=M[a.getMonth()]+" "+a.getDate();

const UNITS = ["cups","cup","tbsp","tablespoons","tablespoon","tsp","teaspoons","teaspoon","lbs","lb","pounds","pound","oz","ounces","ounce","g","kg","ml","l","liters","cloves","clove","cans","can","jars","jar","pkg","packages","package","bunches","bunch","heads","head","slices","slice","sticks","stick","pinch","dash","qt","quart","pint","dozen","boxes","box","bags","bag","containers","container","bottles","bottle","ears","stalks","stalk","sprigs","sprig","links","fillets","fillet","breasts","breast","thighs","thigh"];
const UNIT_CANON = {cups:"cup",tablespoons:"tbsp",tablespoon:"tbsp",teaspoons:"tsp",teaspoon:"tsp",lbs:"lb",pounds:"lb",pound:"lb",ounces:"oz",ounce:"oz",liters:"l",cloves:"clove",cans:"can",jars:"jar",packages:"pkg","package":"pkg",bunches:"bunch",heads:"head",slices:"slice",sticks:"stick",boxes:"box",bags:"bag",containers:"container",bottles:"bottle",stalks:"stalk",sprigs:"sprig",fillets:"fillet",breasts:"breast",thighs:"thigh"};
const FRAC = {"½":.5,"¼":.25,"¾":.75,"⅓":1/3,"⅔":2/3,"⅛":.125};

function parseQty(str){
  let s=str.trim();
  for(const f in FRAC){ s=s.replace(f," "+f+" "); }
  s=s.replace(/\s+/g," ").trim();
  let q=0, matched=false;
  // "1 1/2" or "1 ½"
  let m=s.match(/^(\d+)\s+(\d+)\/(\d+)\s*/) || null;
  if(m){ q=Number(m[1])+Number(m[2])/Number(m[3]); s=s.slice(m[0].length); matched=true; }
  if(!matched){ m=s.match(/^(\d+)\s+([½¼¾⅓⅔⅛])\s*/); if(m){ q=Number(m[1])+FRAC[m[2]]; s=s.slice(m[0].length); matched=true; } }
  if(!matched){ m=s.match(/^(\d+)\/(\d+)\s*/); if(m){ q=Number(m[1])/Number(m[2]); s=s.slice(m[0].length); matched=true; } }
  if(!matched){ m=s.match(/^([½¼¾⅓⅔⅛])\s*/); if(m){ q=FRAC[m[1]]; s=s.slice(m[0].length); matched=true; } }
  if(!matched){ m=s.match(/^(\d*\.?\d+)\s*/); if(m){ q=Number(m[1]); s=s.slice(m[0].length); matched=true; } }
  // unit
  let u="";
  const um=s.match(/^([A-Za-z.]+)\s+/);
  if(um){
    const w=um[1].toLowerCase().replace(/\.$/,"");
    if(UNITS.includes(w)){ u=UNIT_CANON[w]||w; s=s.slice(um[0].length); }
  }
  return {q: matched?q:0, u, name:s.trim()};
}
function fmtQty(n){
  if(!n) return "";
  const whole=Math.floor(n+1e-9), frac=n-whole;
  if(frac<.04) return String(whole);
  const map=[[.125,"1/8"],[.25,"1/4"],[1/3,"1/3"],[.375,"3/8"],[.5,"1/2"],[.625,"5/8"],[2/3,"2/3"],[.75,"3/4"],[.875,"7/8"]];
  let best=null,bd=.05;
  for(const [v,s] of map){ const d=Math.abs(frac-v); if(d<bd){bd=d;best=s;} }
  if(best) return (whole?whole+" ":"")+best;
  return String(Math.round(n*100)/100);
}

/* Longest keyword wins, so "garlic powder" beats "garlic" and
   "cornstarch" beats "corn". */
function guessAisle(name, unit){
  const n=" "+name.toLowerCase()+" ";
  let best=A["not"], len=0;
  for(const a of AISLES){
    const words=AISLE_WORDS[a]; if(!words) continue;
    for(const w of words){ if(w.length>len && n.includes(w)){ best=a; len=w.length; } }
  }
  // the unit often settles it: a can of corn is canned goods, not fresh corn,
  // and 2 sprigs of rosemary is the herb shelf in Produce, not the spice rack
  const u=(unit||"").toLowerCase();
  if((u==="can"||u==="jar") && (best===A.produce || best===A["not"])) return A.a5;
  if((u==="sprig"||u==="bunch"||u==="head"||u==="stalk"||u==="ear") && best===A.a6) return A.produce;
  return best;
}

function parseIngLine(line){
  let s=line.trim();
  if(!s) return null;
  s=s.replace(/^[-*•]\s*/,"");
  let aisle=null;
  const am=s.match(/@([A-Za-z0-9& ]+)$/);
  if(am){
    const want=am[1].trim().toLowerCase();
    const hit = A["a"+want] || AISLES.find(a=>a.toLowerCase().startsWith(want))
             || AISLES.find(a=>a.toLowerCase().includes(want));
    if(hit){ aisle=hit; s=s.slice(0,am.index).trim(); }
  }
  const p=parseQty(s);
  if(!p.name) return null;
  // an aisle is only stored when the user pinned one with @Aisle;
  // otherwise it gets worked out fresh each time the list is built
  return aisle ? {q:p.q, u:p.u, name:p.name, aisle, fixed:true}
               : {q:p.q, u:p.u, name:p.name};
}
function ingLine(ing){
  const q=fmtQty(ing.q);
  return [q, fmtUnit(ing.u, ing.q), ing.name].filter(Boolean).join(" ");
}

  s=s.replace(/^\s*(large|small|medium|big|whole|fresh|ripe|boneless|skinless)\s+/i,"");
  return s.replace(/\s+/g," ").trim();
}
function singular(w){
  const l=w.toLowerCase();
  if(l.length<4 || /(ss|us|is)$/.test(l)) return l;
  if(/ies$/.test(l)) return l.slice(0,-3)+"y";
  if(/(oes|ches|shes|xes|sses)$/.test(l)) return l.replace(/es$/,"");
  if(/s$/.test(l)) return l.slice(0,-1);
  return l;
}
function normKey(n){
  const parts=baseName(n).toLowerCase().split(" ").filter(Boolean);
  if(parts.length) parts[parts.length-1]=singular(parts[parts.length-1]);
  return parts.join(" ");
}

   merge instead of one silently overwriting the other. */
function now(){ return Date.now(); }
function migrate(st){
  st.del = st.del || {r:{},x:{}};
  st.del.r = st.del.r || {}; st.del.x = st.del.x || {};
  st.sync = st.sync || {url:"", code:"", on:false};
  st.rev = st.rev || 0;
  (st.recipes||[]).forEach(r=>{ if(!r.t) r.t=1; });
  for(const k in (st.weeks||{})){
    const w=st.weeks[k];
    w.days = w.days || [null,null,null,null,null,null,null];
    w.dayT = w.dayT || w.days.map(()=>1);
    w.extras = (w.extras||[]).map(x=>({t:1, ...x}));
    const c={};
    for(const key in (w.checked||{})){
      const v=w.checked[key];
      c[key] = (v && typeof v==="object") ? v : {v:1, t:1};
    }
    w.checked=c;
  }
  return st;
}
function isChecked(w,key){ const c=w.checked&&w.checked[key]; return !!(c&&c.v); }
function setChecked(w,key,on){ w.checked=w.checked||{}; w.checked[key]={v:on?1:0, t:now()}; }

function save(){

    const w=state.weeks[k];
    if(k!==state.current && !w.days.some(Boolean) && !(w.extras&&w.extras.length)) delete state.weeks[k];

/* ---------- shopping list build ---------- */
function buildList(){
  const w=week(), map=new Map();
  w.days.forEach((m,di)=>{
    if(!m || m.type!=="recipe") return;
    const r=recipe(m.id); if(!r) return;
    const scale=(m.servings||r.servings||4)/(r.servings||4);
    (r.ingredients||[]).forEach(ing=>{
      const aisle=(ing.fixed && ing.aisle) ? ing.aisle : guessAisle(ing.name, ing.u);
      // tsp / tbsp / cup all measure the same thing, so pool them in teaspoons
      // and pick a readable unit again once everything is added up
      const spoon=SPOON[(ing.u||"").toLowerCase()];
      const unit=spoon? VOL : (ing.u||"");
      const key=normKey(ing.name)+"|"+unit.toLowerCase();
      const add=(ing.q||0)*scale*(spoon||1);
      if(map.has(key)){
        const e=map.get(key);
        e.q+=add;
        // keep the longer wording — "bell peppers" reads better than "bell pepper"
        const nb=baseName(ing.name); if(nb.length>e.name.length) e.name=nb;
        if(!e.from.includes(r.name)) e.from.push(r.name);
      } else {
        map.set(key,{key, q:add, u:unit, name:baseName(ing.name), aisle, from:[r.name]});
      }
    });
  });
  const groups={};
  [...map.values()].forEach(it=>{ (groups[it.aisle]=groups[it.aisle]||[]).push(it); });
  (w.extras||[]).forEach(x=>{
    const a=x.aisle||guessAisle(x.name);
    (groups[a]=groups[a]||[]).push({key:"x:"+x.id, q:0, u:"", name:x.name, aisle:a, from:[], extra:x.id});
  });
  // you cannot buy 3 3/4 cloves of garlic — round counted things up
  map.forEach(it=>{
    if(it.u!==VOL) return;
    const quarterCup=SPOON.cup/4;
    // cups only when the total lands on a clean quarter — otherwise 33 tsp of
    // butter would read "0.69 cup" instead of a usable "11 tbsp"
    if(it.q>=quarterCup && Math.abs(it.q/quarterCup-Math.round(it.q/quarterCup))<1e-6){
      it.q/=SPOON.cup; it.u="cup";
    }
    else if(it.q>=SPOON.tbsp){ it.q/=SPOON.tbsp; it.u="tbsp"; }
    else it.u="tsp";
  });
  const COUNTED=["","clove","can","jar","pkg","head","bunch","box","bag","bottle","container","slice","stick","ear","stalk","sprig","link","fillet","breast","thigh","dozen"];
  map.forEach(it=>{ if(COUNTED.includes(it.u||"")) it.q=Math.ceil(it.q-1e-9); });
  const order=AISLES.filter(a=>groups[a]);
  order.forEach(a=>groups[a].sort((x,y)=>x.name.localeCompare(y.name)));
  return {groups, order, all:order.flatMap(a=>groups[a])};
}

const PROTEINS=["beef","pork","chicken","seafood"];
function proteinOf(r){ return (r.tags||[]).find(t=>PROTEINS.includes(t.toLowerCase())) || "other"; }
function hasTag(r,t){ return (r.tags||[]).some(x=>x.toLowerCase()===t); }
function pickRandom(list){ return list[Math.floor(Math.random()*list.length)]; }

/* Builds a week the way Richard actually eats: one pasta night, one Cajun
   night, and the rest spread across beef / pork / chicken / fish rather
   than landing on beef three nights running. */
function fillRandom(){
  const w=week();
  if(!state.recipes.length){ toast("Add some recipes first"); return; }
  const openDays=[]; for(let i=0;i<7;i++) if(!w.days[i]) openDays.push(i);
  if(!openDays.length){ toast("Every day is already planned"); return; }

  const planned=w.days.filter(d=>d&&d.type==="recipe").map(d=>recipe(d.id)).filter(Boolean);
  const taken=new Set(planned.map(r=>r.id));
  const counts={}; PROTEINS.concat("other").forEach(p=>counts[p]=0);
  planned.forEach(r=>counts[proteinOf(r)]++);
  const avail=()=>state.recipes.filter(r=>!taken.has(r.id));

  const picks=[];
  const take=r=>{ if(!r) return; taken.add(r.id); counts[proteinOf(r)]++; picks.push(r); };

  // The two standing nights first, so they always get a slot. Cajun Chicken
  // Alfredo is tagged both, so prefer a non-Cajun pasta — otherwise it fills
  // the pasta slot and Cajun still comes up again later in the week.
  const chosen=()=>planned.concat(picks);
  if(picks.length<openDays.length && !chosen().some(r=>hasTag(r,"pasta")))
    take(pickRandom(avail().filter(r=>hasTag(r,"pasta") && !hasTag(r,"cajun"))) ||
         pickRandom(avail().filter(r=>hasTag(r,"pasta"))));
  if(picks.length<openDays.length && !chosen().some(r=>hasTag(r,"cajun")))
    take(pickRandom(avail().filter(r=>hasTag(r,"cajun") && !hasTag(r,"pasta"))) ||
         pickRandom(avail().filter(r=>hasTag(r,"cajun"))));

  // fill the rest from whichever protein has come up least so far, holding
  // pasta and Cajun to their one night each unless nothing else is left
  while(picks.length<openDays.length){
    const pool=avail();
    if(!pool.length) break;
    const plain=pool.filter(r=>!hasTag(r,"pasta") && !hasTag(r,"cajun"));
    const from=plain.length?plain:pool;
    const lowest=Math.min(...from.map(r=>counts[proteinOf(r)]));
    take(pickRandom(from.filter(r=>counts[proteinOf(r)]===lowest)));
  }
  if(!picks.length){ toast("No unused recipes left to add"); return; }

  // shuffle so the pasta and Cajun nights are not always Mon/Tue
  for(let i=picks.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [picks[i],picks[j]]=[picks[j],picks[i]]; }
  picks.forEach((r,k)=>{ w.days[openDays[k]]={type:"recipe", id:r.id, servings:r.servings||4}; w.dayT[openDays[k]]=now(); });

async function shareOrCopy(text, what){
  if(navigator.share){
    try{ await navigator.share({text}); return; }catch(e){ if(e && e.name==="AbortError") return; }
  }
  copyText(text, what);
}
function copyText(text, what){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>toast(what+" copied — paste it anywhere")).catch(()=>fallbackCopy(text,what));
  } else fallbackCopy(text,what);
}
function fallbackCopy(text,what){
  const ta=document.createElement("textarea");
  ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); toast(what+" copied"); }catch(e){ toast("Could not copy"); }
  document.body.removeChild(ta);
}

function importData(file){
  const fr=new FileReader();
  fr.onload=()=>{
    try{
      const s=JSON.parse(fr.result);
      if(!s.recipes) throw new Error("bad file");
      if(!confirm("Replace everything on this device with the backup? ("+s.recipes.length+" recipes)")) return;

      if(!state.weeks) state.weeks={};
      save(); render(); toast("Backup restored");
    }catch(e){ toast("That file could not be read"); }

}

const isUUID = v => /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(String(v || ""));
function newId(){
  if (crypto && crypto.randomUUID) return crypto.randomUUID();
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0;
    return (c === "x" ? r : (r & 3 | 8)).toString(16);
  });
}

/* Recipes created before the move have short ids; Postgres wants uuids. */
function normaliseIds(){
  const map = {};
  (state.recipes || []).forEach(r => { if (!isUUID(r.id)) { const n = newId(); map[r.id] = n; r.id = n; } });
  for (const k in state.weeks) {
    (state.weeks[k].days || []).forEach(d => { if (d && d.type === "recipe" && map[d.id]) d.id = map[d.id]; });
    (state.weeks[k].extras || []).forEach(x => { if (!isUUID(x.id)) x.id = newId(); });
  }
}

function rowToRecipe(r){

/* ---------- change detection ----------
   A snapshot of what the server last saw, so a save only writes what moved. */
function snap(){
  const o = { recipes:{}, days:{}, extras:{}, checks:{} };
  (state.recipes || []).forEach(r => { o.recipes[r.id] = JSON.stringify(recipeToRow(r)); });
  for (const k in state.weeks) {
    const w = state.weeks[k];
    (w.days || []).forEach((d, i) => { o.days[k + "|" + i] = JSON.stringify(d || null); });
    (w.extras || []).forEach(x => { o.extras[x.id] = JSON.stringify({ w:k, n:x.name, a:x.aisle || null }); });
    const c = w.checked || {};
    for (const key in c) o.checks[k + "|" + key] = c[key] && c[key].v ? 1 : 0;
  }
  return o;
}

function schedulePersist(){
  if (!householdId) return;
  clearTimeout(persistT);
  persistT = setTimeout(persistNow, 700);
}

async function persistNow(){
  if (!householdId || persisting) return;
  persisting = true; setNet("busy");
  try {
    const now = snap();
    const was = snapshot || { recipes:{}, days:{}, extras:{}, checks:{} };
    const stamp = new Date().toISOString();
    const jobs = [];

    const upR = [];
    for (const id in now.recipes) if (now.recipes[id] !== was.recipes[id]) upR.push(JSON.parse(now.recipes[id]));
    if (upR.length) jobs.push(sb.from("recipes").upsert(upR));
    const delR = Object.keys(was.recipes).filter(id => !(id in now.recipes));
    if (delR.length) jobs.push(sb.from("recipes").update({ deleted_at: stamp }).in("id", delR));

    const upD = [];
    for (const k in now.days) if (now.days[k] !== was.days[k]) {
      const cut = k.lastIndexOf("|");
      const wkey = k.slice(0, cut), i = +k.slice(cut + 1), d = JSON.parse(now.days[k]);
      upD.push({ household_id:householdId, week_start:wkey, day_index:i,
                 recipe_id: d && d.type === "recipe" ? d.id : null,
                 note_text: d && d.type === "text" ? d.text : null,
                 emoji:     d && d.type === "text" ? d.emoji : null,
                 servings:  d && d.type === "recipe" ? d.servings : null });
    }
    if (upD.length) jobs.push(sb.from("plan_days").upsert(upD, { onConflict:"household_id,week_start,day_index" }));

    const upX = [];
    for (const id in now.extras) if (now.extras[id] !== was.extras[id]) {
      const v = JSON.parse(now.extras[id]);
      upX.push({ id, household_id:householdId, week_start:v.w, name:v.n, aisle:v.a });
    }
    if (upX.length) jobs.push(sb.from("extras").upsert(upX));
    const delX = Object.keys(was.extras).filter(id => !(id in now.extras));
    if (delX.length) jobs.push(sb.from("extras").update({ deleted_at: stamp }).in("id", delX));

    const upC = [];
    for (const k in now.checks) if (now.checks[k] !== was.checks[k]) {
      const cut = k.indexOf("|");                       // week key is a date, so the first pipe splits it
      upC.push({ household_id:householdId, week_start:k.slice(0, cut),
                 item_key:k.slice(cut + 1), checked: !!now.checks[k] });
    }
    if (upC.length) jobs.push(sb.from("item_checks").upsert(upC, { onConflict:"household_id,week_start,item_key" }));

    if (jobs.length) {
      const res = await Promise.all(jobs);
      for (const r of res) if (r.error) throw r.error;
    }
    snapshot = now;
    setNet("ok");
  } catch (e) {
    setNet("err");                                       // the local copy is still saved; we retry on the next change
    console.warn("save failed", e);
  }
  persisting = false;
}

/* ---------- load ---------- */
async function loadAll(){
  if (!householdId) return;
  setNet("busy");
  try {
    const [rs, pd, ex, ck] = await Promise.all([
      sb.from("recipes").select("*").is("deleted_at", null),
      sb.from("plan_days").select("*"),
      sb.from("extras").select("*").is("deleted_at", null),
      sb.from("item_checks").select("*")
    ]);
    for (const r of [rs, pd, ex, ck]) if (r.error) throw r.error;

    state.recipes = (rs.data || []).map(rowToRecipe);
    const weeks = {};
    const wk = k => (weeks[k] = weeks[k] || blankWeek());
    (pd.data || []).forEach(row => {
      const w = wk(row.week_start);
      w.days[row.day_index] =
        row.recipe_id ? { type:"recipe", id:row.recipe_id, servings:row.servings || 4 }
      : row.note_text ? { type:"text", text:row.note_text, emoji:row.emoji || "🍴" }
      : null;
      w.dayT[row.day_index] = Date.parse(row.updated_at) || 1;
    });
    (ex.data || []).forEach(row => wk(row.week_start).extras.push({ id:row.id, name:row.name, aisle:row.aisle, t:1 }));
    (ck.data || []).forEach(row => { wk(row.week_start).checked[row.item_key] = { v: row.checked ? 1 : 0, t: Date.parse(row.updated_at) || 1 }; });

    state.weeks = weeks;
    if (!state.weeks[state.current]) state.weeks[state.current] = blankWeek();
    localStorage.setItem(KEY, JSON.stringify(state));
    snapshot = snap();
    render();
    setNet("ok");
  } catch (e) {
    setNet("err");
    toast("Could not reach the database — showing the copy on this device");
  }
}

  const { data, error } = await sb.rpc("invite_to_household", { invitee_email: email });
  if (error) { toast(error.message || "Could not add them"); return; }
  if (data === "not_signed_up") {
    toast("They have not signed in yet — ask them to open the app first");
    return;
  }
  closeSheet();
  toast(email + " can now see your household");
}

async function signOut(){
  if (liveChannel) { sb.removeChannel(liveChannel); liveChannel = null; }
  await sb.auth.signOut();
  session = null; householdId = null; snapshot = null;
  delete state.householdId;
  localStorage.setItem(KEY, JSON.stringify(state));
  closeSheet();
  gateSignIn();
  paintNet();
}

/* ---------- boot ---------- */
async function afterAuth(){
  paintNet();
  if (!session) { gateSignIn(); return; }
  const { data, error } = await sb.rpc("my_household");
  if (error) {
    // Could be no signal rather than no household. If this device has been in
    // a household before, trust that and work from the local copy — being
    // locked out of the shopping list in a shop with bad reception is worse
    // than being briefly out of date.
    if (state.householdId) {
      householdId = state.householdId;
      hideGate(); setNet("err"); render(); subscribeLive();
      toast("Offline — showing the copy on this device");
      return;
    }
    gateHousehold(); return;
  }
  householdId = data;
  if (!householdId) { gateHousehold(); return; }
  state.householdId = householdId;
  localStorage.setItem(KEY, JSON.stringify(state));
  hideGate();
  await adoptLocalOrLoad();
  subscribeLive();
}

async function boot(){
  try {
    const { data } = await sb.auth.getSession();
    session = data ? data.session : null;
  } catch (e) { session = null; }
  sb.auth.onAuthStateChange((_evt, s2) => {
    const had = !!session;
    session = s2;
    if (!had && s2) afterAuth(); else paintNet();
  });
  await afterAuth();
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && householdId && !persisting) loadAll();
});

let toastT;
function toast(msg){
  const el=document.getElementById("toast");
  el.textContent=msg; el.classList.add("show");
  clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove("show"),2600);
}

render();
boot();
</script>
</body>
</html>
