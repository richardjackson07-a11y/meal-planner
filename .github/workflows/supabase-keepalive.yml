name: Supabase keep-alive

# Supabase pauses a free project after 7 days with no incoming requests.
# This does a real DB write three times a week, so a single skipped run still
# leaves a gap well under the limit.
#
# Cadence note: GitHub cron is UTC and runs are best-effort — during heavy load
# GitHub delays or drops scheduled jobs, especially ones set to the top of the
# hour. Hence Mon/Wed/Fri at :17 past rather than twice a week on the hour.
# Worst case with one dropped run is a 5-day gap; two dropped in a row is 7.

on:
  schedule:
    - cron: "17 9 * * 1,3,5"   # Mon, Wed, Fri at 09:17 UTC (04:17 Houston CDT)
  workflow_dispatch:            # lets you run it by hand from the Actions tab

permissions:
  contents: write               # needed only by the anti-disable step below

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Write to the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_ANON_KEY secrets are not set"
            exit 1
          fi
          code=$(curl -sS --max-time 30 -o /tmp/resp.txt -w '%{http_code}' \
            -X POST "${SUPABASE_URL}/rest/v1/rpc/keepalive" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "HTTP ${code}"
          cat /tmp/resp.txt || true
          echo
          if [ "${code}" != "200" ]; then
            echo "::error::Keep-alive write failed — the project may be paused already"
            exit 1
          fi
          echo "Database write succeeded; pause timer reset."

      # GitHub disables scheduled workflows after 60 days with no commits on the
      # default branch. That would silently kill this job, and Supabase would
      # then pause a week later. Committing a marker only when the repo has been
      # quiet a long while resets that clock without spamming the history.
      - name: Keep the schedule itself from being disabled
        run: |
          set -euo pipefail
          last=$(git log -1 --format=%ct)
          age_days=$(( ( $(date -u +%s) - last ) / 86400 ))
          echo "Last commit was ${age_days} days ago."
          if [ "${age_days}" -lt 50 ]; then
            echo "Recent enough — nothing to do."
            exit 0
          fi
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/last-keepalive.txt
          git config user.name  "keepalive bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last-keepalive.txt
          git commit -m "chore: keep scheduled workflow enabled"
          git push
